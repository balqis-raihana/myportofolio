<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - HTMX Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 2rem auto;
            max-width: 720px;
            padding: 0 1rem;
            color: #222;
        }
        h1 { margin-bottom: 0.5rem; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-block; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        th { background: #f5f5f5; }
        form.add-form {
            display: flex;
            gap: 8px;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="email"], input[type="search"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 6px 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button[hx-delete] { background: #dc2626; }
        button[hx-delete]:hover { background: #b91c1c; }
        button[hx-get] { background: #4b5563; }
        button[hx-get]:hover { background: #374151; }
        .search-box {
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <p><a href="/" style="text-decoration:none;">&larr; Kembali ke Portofolio</a></p>
    <h1>Daftar Kontak</h1>

    <div class="search-box">
        <input type="search"
               name="q"
               placeholder="Cari kontak..."
               hx-get="{% url 'contacts:contact_search' %}"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#contact-rows"
               hx-indicator="#search-indicator">
        <span id="search-indicator" class="htmx-indicator">Mencari...</span>
    </div>

    <h1>Tambah Kontak</h1>
    <form class="add-form"
          hx-post="{% url 'contacts:contact_add' %}"
          hx-target="#contact-rows"
          hx-swap="innerHTML"
          hx-on::after-request="if (event.detail.successful) this.reset()">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Nama" required>
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit">Tambah</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="contact-rows">
            {% include "contacts/_contact_rows.html" %}
        </tbody>
    </table>
</body>
</html>
