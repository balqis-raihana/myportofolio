<div id="edit-coursework-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="edit-coursework-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="edit-coursework-modal" popovertargetaction="hide" aria-label="Tutup form edit mata kuliah"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="edit-coursework-modal" popovertargetaction="hide" aria-label="Tutup form edit mata kuliah">&times;</button>
        <h2 id="edit-coursework-modal-title">Edit Coursework</h2>
        <form id="edit-coursework-form" class="project-form">
            {% csrf_token %}
            <input type="hidden" id="edit-cw-id" name="id">
            <div class="form-group">
                <label for="edit-cw-name">Course Name</label>
                <input type="text" id="edit-cw-name" name="name" required class="form-control" placeholder="e.g. Database Systems">
            </div>
            <div class="form-group">
                <label for="edit-cw-category">Category / Stream</label>
                <input type="text" id="edit-cw-category" name="category" required class="form-control" placeholder="e.g. Data & Information">
            </div>
            <div class="form-group">
                <label for="edit-cw-credits">Credits (SKS)</label>
                <input type="number" id="edit-cw-credits" name="credits" min="1" max="12" required class="form-control" placeholder="3">
            </div>
            <div class="form-group">
                <label for="edit-cw-description">Description</label>
                <textarea id="edit-cw-description" name="description" rows="3" required class="form-control" placeholder="Describe the course..."></textarea>
            </div>
            <div class="form-group">
                <label for="edit-cw-journal">Learning Journal (Optional)</label>
                <textarea id="edit-cw-journal" name="journal" rows="4" class="form-control" placeholder="Reflections, artifacts, etc..."></textarea>
            </div>
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="edit-coursework-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
