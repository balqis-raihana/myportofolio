<div id="add-coursework-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="add-coursework-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-coursework-modal" popovertargetaction="hide" aria-label="Tutup form tambah mata kuliah"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-coursework-modal" popovertargetaction="hide" aria-label="Tutup form tambah mata kuliah">&times;</button>
        <h2 id="add-coursework-modal-title">Tambah Coursework Baru</h2>
        <form id="coursework-form" method="post" action="{% url 'main:create_coursework' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-coursework-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Coursework</button>
            </div>
        </form>
    </div>
</div>
