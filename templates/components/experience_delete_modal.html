<a href="{% url 'main:edit_experience' experience.id %}"
   class="button button-secondary"
   aria-label="Edit {{ experience.title }}"
   title="Edit experience">
    Edit
</a>
<button type="button"
        class="button button-danger"
        popovertarget="delete-exp-{{ experience.id }}"
        aria-label="Delete {{ experience.title }}"
        title="Delete experience">
    Delete
</button>

<div id="delete-exp-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-exp-title-{{ experience.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-exp-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-exp-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-exp-title-{{ experience.id }}">Delete Experience?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>{% if experience.company %} at <em>{{ experience.company }}</em>{% endif %}?
        </p>
        <form method="post" action="{% url 'main:delete_experience' experience.id %}">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 1rem; text-align: left;">
                <label for="delete-exp-pass-{{ experience.id }}" style="font-size: 0.85rem; color: var(--text-muted);">Admin Secret Key:</label>
                <input type="password"
                       id="delete-exp-pass-{{ experience.id }}"
                       name="crud_password"
                       placeholder="Enter secret key to delete"
                       required
                       autocomplete="current-password">
            </div>
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-exp-{{ experience.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
