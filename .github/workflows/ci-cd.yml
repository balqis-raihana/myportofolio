name: CI and Deploy to PWS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django Project
        env:
          SECRET_KEY: django-insecure-ci-test-key-for-pbp
          CRUD_SECRET_KEY: JamesBond007
          PRODUCTION: 'False'
        run: |
          python manage.py check

      - name: Run Tests
        env:
          SECRET_KEY: django-insecure-ci-test-key-for-pbp
          CRUD_SECRET_KEY: JamesBond007
          PRODUCTION: 'False'
        run: |
          python manage.py test contacts

  deploy:
    name: Push to PWS
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to PWS (Pacil Web Service)
        env:
          PWS_USER: ${{ secrets.PWS_USERNAME }}
          PWS_PASS: ${{ secrets.PWS_PASSWORD }}
        run: |
          if [ -n "$PWS_USER" ] && [ -n "$PWS_PASS" ]; then
            git push "https://${PWS_USER}:${PWS_PASS}@pws.cs.ui.ac.id/balqis.raihana/myportofolio" HEAD:master --force
          else
            echo "Notice: PWS_USERNAME or PWS_PASSWORD secret not set in repository settings."
          fi
